name: Backend checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install --require-hashes -r backend/requirements.lock
      - run: python -m flake8 backend scripts
      - run: python -m pytest --cov=backend/app --cov-report=term-missing --cov-fail-under=90
